name: Build JDCloud AX1800 Pro

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/${{ github.repository }}
  REPO_BRANCH: ${{ github.ref_name }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Maximize disk space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 1024
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget xsltproc libelf-dev ecj fastjar java-propose-classpath
        sudo apt-get clean

    - name: Checkout
      uses: actions/checkout@v4

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config
      run: |
        cat > .config << 'EOF'
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_ap-cp03-c1=y
        CONFIG_TARGET_ROOTFS_INITRAMFS=n
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        sed -i 's/^[ \t]*//' .config
        make defconfig

    - name: Download packages
      run: |
        make download -j$(nproc) V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    - name: Compile tools
      run: make tools/install -j$(nproc) V=s || make tools/install -j1 V=s

    - name: Compile toolchain
      run: make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

    - name: Build firmware
      id: compile
      run: |
        make -j$(nproc) V=s || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd bin/targets/qualcommax/ipq60xx
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "## Firmware Info" >> $GITHUB_STEP_SUMMARY
        ls -lh *.bin 2>/dev/null || echo "No .bin files found"

    - name: Upload firmware
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: JDCloud-AX1800Pro-firmware
        path: ${{ env.FIRMWARE }}/*
        retention-days: 7
